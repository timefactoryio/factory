name: release

on:
  workflow_dispatch:
    inputs:
      version_bump:
        description: "Version bump (patch, minor, major)"
        required: true
        type: choice
        options:
        - patch
        - minor
        - major

jobs:
  release:
    runs-on: [ self-hosted, linux, x64 ]
    permissions:
      contents: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.25.6'

    - name: Bump version and push tag
      id: tag_version
      uses: mathieudutour/github-tag-action@v6.1
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        default_bump: ${{ inputs.version_bump }}
        tag_prefix: v

    - name: Build binaries
      env:
        VERSION: ${{ steps.tag_version.outputs.new_tag }}
      run: |
        mkdir -p dist

        # Linux AMD64
        GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o dist/${{ github.event.repository.name }}-linux-amd64

        # Linux ARM64
        GOOS=linux GOARCH=arm64 go build -ldflags="-s -w" -o dist/${{ github.event.repository.name }}-linux-arm64

        # Linux ARM v7
        GOOS=linux GOARCH=arm GOARM=7 go build -ldflags="-s -w" -o dist/${{ github.event.repository.name }}-linux-armv7

        # macOS AMD64
        GOOS=darwin GOARCH=amd64 go build -ldflags="-s -w" -o dist/${{ github.event.repository.name }}-darwin-amd64

        # macOS ARM64
        GOOS=darwin GOARCH=arm64 go build -ldflags="-s -w" -o dist/${{ github.event.repository.name }}-darwin-arm64

        # Windows AMD64
        GOOS=windows GOARCH=amd64 go build -ldflags="-s -w" -o dist/${{ github.event.repository.name }}-windows-amd64.exe

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: ${{ steps.tag_version.outputs.new_tag }}
        name: Release ${{ steps.tag_version.outputs.new_tag }}
        draft: false
        prerelease: ${{ inputs.version_bump == 'patch' }}
        files: dist/*
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
