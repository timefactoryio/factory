name: build

on:
  workflow_call:
    inputs:
      platforms:
        description: "Build for..."
        required: true
        type: choice
        options:
        - amd
        - arm
        - amd,arm
        - all

jobs:
  build:
    runs-on: [ self-hosted, linux, x64 ]
    permissions:
      contents: read

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USER }}
        password: ${{ secrets.DOCKER_TOKEN }}

    - name: Determine platforms
      id: platforms
      run: |
        case "${{ inputs.platforms }}" in
          "amd")
            echo "list=linux/amd64" >> $GITHUB_OUTPUT
            ;;
          "arm")
            echo "list=linux/arm64" >> $GITHUB_OUTPUT
            ;;
          "amd,arm")
            echo "list=linux/amd64,linux/arm64" >> $GITHUB_OUTPUT
            ;;
          "all")
            echo "list=linux/amd64,linux/arm64,linux/arm/v7" >> $GITHUB_OUTPUT
            ;;
        esac

    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: docker.io/timefactory/${{ github.event.repository.name }}
        tags: |
          type=semver,pattern={{version}}

    - name: Build and push
      uses: docker/build-push-action@v5
      with:
        context: .
        platforms: ${{ steps.platforms.outputs.list }}
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
