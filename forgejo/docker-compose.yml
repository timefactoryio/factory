services:
  server:
    image: codeberg.org/forgejo/forgejo:14
    container_name: forgejo
    environment:
      - USER_UID=1000
      - USER_GID=1000
      - FORGEJO__database__DB_TYPE=postgres
      - FORGEJO__database__HOST=postgres:5432
      - FORGEJO__database__NAME=forgejo
      - FORGEJO__database__USER=postgres
      - FORGEJO__database__PASSWD=${PASSWORD}
      - FORGEJO__server__ROOT_URL=https://git.timefactory.io/
      - FORGEJO__server__SSH_DOMAIN=timefactory.trex-kardashev.ts.net
      - FORGEJO__server__SSH_PORT=2222
      - FORGEJO__oauth2_client__ENABLE_AUTO_REGISTRATION=true
      - FORGEJO__oauth2_client__ACCOUNT_LINKING=auto
      - FORGEJO__service__DISABLE_REGISTRATION=true
      - FORGEJO__service__ALLOW_ONLY_EXTERNAL_REGISTRATION=true
      - FORGEJO__service__REQUIRE_SIGNIN_VIEW=true
      - FORGEJO__session__PROVIDER=db
    restart: always
    networks:
      - timefactory
    volumes:
      - forgejo:/data
      - /etc/localtime:/etc/localtime:ro
    ports:
      - "100.71.56.97:2222:22"
    labels:
      - traefik.enable=true
      - traefik.http.routers.forgejo.rule=Host(`git.timefactory.io`)
      - traefik.http.routers.forgejo.entrypoints=websecure
      - traefik.http.routers.forgejo.tls=true
      - traefik.http.routers.forgejo.tls.certresolver=cloudflare
      - traefik.http.services.forgejo.loadbalancer.server.port=3000

networks:
  timefactory:
    external: true
volumes:
  forgejo:
    external: true
